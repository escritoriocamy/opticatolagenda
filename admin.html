<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de reservas · Consultorio Oftalmológico</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F1F0EB;font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#0F2230}
  *{box-sizing:border-box}
  a{color:#14496E}
  button{font-family:inherit}
  input,select{font-family:inherit}

  .topbar{position:sticky;top:0;z-index:20;background:#14496E;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:-0.01em}
  .topbar .brand span.sub{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
  .topbar .actions{display:flex;align-items:center;gap:14px;font-size:12.5px}
  .topbar .actions button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;letter-spacing:.03em}
  .topbar .actions button:hover{background:rgba(255,255,255,.12)}

  /* ---- Login ---- */
  #login-screen{min-height:calc(100vh - 66px);display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(15,34,48,.10);padding:40px 36px;width:100%;max-width:380px}
  .login-card h1{margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:-0.02em}
  .login-card p{margin:0 0 24px;font-size:14.5px;color:#64757F;line-height:1.5}
  .login-card label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#64757F;margin-bottom:7px}
  .login-card input[type="password"]{width:100%;border:1px solid #DCE2E5;border-radius:10px;padding:13px 14px;font-size:15px;color:#0F2230}
  .login-card input[type="password"]:focus{outline:2px solid #14496E;outline-offset:1px;border-color:#14496E}
  .login-row-check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:#42545E;text-transform:none;font-weight:400;letter-spacing:normal}
  .login-card button{width:100%;margin-top:20px;background:#14496E;color:#fff;border:none;border-radius:999px;padding:15px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .login-card button:hover{background:#0C3450}
  .login-error{margin-top:14px;font-size:13.5px;color:#C22A12;font-weight:600}

  /* ---- Dashboard ---- */
  #dashboard{display:none;max-width:1100px;margin:0 auto;padding:28px 20px 80px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
  .stat-card{background:#fff;border-radius:16px;padding:20px 22px}
  .stat-card .num{font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1}
  .stat-card .label{margin-top:6px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#64757F;text-transform:uppercase}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
  .tabs{display:flex;gap:6px;background:#fff;border-radius:999px;padding:4px}
  .tabs button{border:none;background:none;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.03em;color:#64757F;cursor:pointer}
  .tabs button.active{background:#14496E;color:#fff}
  .toolbar select,.toolbar input[type="search"]{border:1px solid #DCE2E5;border-radius:10px;padding:10px 14px;font-size:13.5px;color:#0F2230;background:#fff}
  .toolbar select{cursor:pointer}
  .toolbar input[type="search"]{flex:1;min-width:180px}
  .toolbar input[type="search"]:focus,.toolbar select:focus{outline:2px solid #14496E;outline-offset:1px;border-color:#14496E}
  .refresh-btn{border:1px solid #DCE2E5;background:#fff;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;color:#42545E;cursor:pointer;display:flex;align-items:center;gap:7px}
  .refresh-btn:hover{border-color:#14496E;color:#14496E}
  .refresh-btn.loading svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .updated-note{font-size:12px;color:#93A5AF;margin:-10px 0 20px}

  .day-group{margin-bottom:28px}
  .day-heading{font-size:15px;font-weight:700;letter-spacing:-0.01em;color:#14496E;margin:0 0 10px;padding-left:2px;display:flex;align-items:center;gap:10px}
  .day-heading .count{font-size:11.5px;font-weight:600;color:#93A5AF;text-transform:none;letter-spacing:0}
  .appt-card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:8px;display:flex;gap:16px;align-items:flex-start}
  .appt-time{flex:none;width:64px;font-size:17px;font-weight:700;color:#14496E;letter-spacing:-0.01em;padding-top:1px}
  .appt-body{flex:1;min-width:0}
  .appt-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
  .appt-name{font-size:15.5px;font-weight:700;letter-spacing:-0.01em}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
  .badge-diabetes{background:#FBE7E1;color:#B4361A}
  .badge-pagado{background:#DFF3E6;color:#1F7A45}
  .badge-sincosto{background:#EAE3F5;color:#5B3A9E}
  .appt-meta{font-size:13.5px;color:#4C5E68;line-height:1.6}
  .appt-meta b{color:#0F2230;font-weight:600}
  .appt-extra{margin-top:6px;font-size:12.5px;color:#93A5AF}

  .empty-state{background:#fff;border-radius:16px;padding:48px 24px;text-align:center;color:#93A5AF;font-size:14.5px}
  .empty-state svg{margin-bottom:14px;opacity:.5}

  @media (max-width:720px){
    .topbar{padding:12px 16px}
    .stats{grid-template-columns:1fr}
    #dashboard{padding:20px 14px 60px}
    .appt-card{gap:12px;padding:14px}
    .appt-time{width:52px;font-size:15px}
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">
    <img src="logo-consultorio.png.jpeg" alt="" style="height:30px;width:auto;object-fit:contain;background:#fff;border-radius:5px;padding:2px" onerror="this.style.display='none'">
    <span>Panel de reservas<span class="sub">Consultorio Oftalmológico</span></span>
  </span>
  <span class="actions">
    <a href="index.html" style="color:#fff;opacity:.85;text-decoration:none;font-weight:600">← Sitio</a>
    <button id="btn-logout" type="button" style="display:none">Cerrar sesión</button>
  </span>
</div>

<div id="login-screen">
  <div class="login-card">
    <h1>Ingresar</h1>
    <p>Ingresá la clave del consultorio para ver las reservas.</p>
    <label for="in-clave">Clave</label>
    <input id="in-clave" type="password" placeholder="••••••••" autocomplete="off">
    <label class="login-row-check"><input id="in-recordar" type="checkbox" checked style="width:16px;height:16px"> Recordar en este dispositivo</label>
    <button id="btn-entrar" type="button">Entrar</button>
    <div id="login-error" class="login-error" style="display:none"></div>
  </div>
</div>

<div id="dashboard">
  <div class="stats">
    <div class="stat-card"><div class="num" id="stat-hoy">–</div><div class="label">Hoy</div></div>
    <div class="stat-card"><div class="num" id="stat-proximas">–</div><div class="label">Próximas</div></div>
    <div class="stat-card"><div class="num" id="stat-total">–</div><div class="label">Total</div></div>
  </div>

  <div class="toolbar">
    <div class="tabs" id="tabs-periodo">
      <button data-periodo="hoy" type="button">Hoy</button>
      <button data-periodo="proximas" type="button" class="active">Próximas</button>
      <button data-periodo="todas" type="button">Todas</button>
    </div>
    <select id="filtro-medico"><option value="">Todos los oftalmólogos</option></select>
    <select id="filtro-pago">
      <option value="">Todos (pagos)</option>
      <option value="si">Solo pagados</option>
      <option value="no">Solo no pagados</option>
    </select>
    <input id="buscar" type="search" placeholder="Buscar por nombre o cédula…">
    <button id="btn-refresh" class="refresh-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
      Actualizar
    </button>
  </div>
  <div class="updated-note" id="updated-note"></div>

  <div id="lista"></div>
</div>

<div id="modal-cancelar" style="display:none;position:fixed;inset:0;background:rgba(15,34,48,.55);z-index:100;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:16px;padding:28px 26px;max-width:400px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25)">
    <div style="font-size:17px;font-weight:700;color:#0F2230;margin-bottom:6px">Cancelar reserva</div>
    <div id="modal-detalle" style="font-size:14px;color:#42545E;margin-bottom:16px;line-height:1.5"></div>
    <div style="font-size:13px;color:#64757F;margin-bottom:8px">Para confirmar, escribí <b>CANCELAR</b> en mayúsculas:</div>
    <input id="modal-input" type="text" autocomplete="off" style="width:100%;border:1px solid #DCE2E5;border-radius:10px;padding:11px 12px;font-size:14.5px;box-sizing:border-box;margin-bottom:16px">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" id="modal-cerrar" style="background:none;border:1px solid #DCE2E5;color:#42545E;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:8px;cursor:pointer">Volver</button>
      <button type="button" id="modal-confirmar" disabled style="background:#DCE2E5;color:#fff;border:none;font-size:13.5px;font-weight:700;padding:10px 18px;border-radius:8px;cursor:not-allowed">Cancelar reserva</button>
    </div>
  </div>
</div>

<script>
(() => {
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbw-rIQmv8lbFADET3uoZAz7scNTKrtTprHcqrOCnBpZKo5mLfcRwaRslW5yQVwZzvvN/exec';
  const LS_KEY = 'consultorio_clave';

  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  const loginScreen = document.getElementById('login-screen');
  const dashboard = document.getElementById('dashboard');
  const inClave = document.getElementById('in-clave');
  const inRecordar = document.getElementById('in-recordar');
  const btnEntrar = document.getElementById('btn-entrar');
  const loginError = document.getElementById('login-error');
  const btnLogout = document.getElementById('btn-logout');
  const btnRefresh = document.getElementById('btn-refresh');
  const updatedNote = document.getElementById('updated-note');
  const filtroMedico = document.getElementById('filtro-medico');
  const filtroPago = document.getElementById('filtro-pago');
  const buscar = document.getElementById('buscar');
  const lista = document.getElementById('lista');
  const tabsPeriodo = document.getElementById('tabs-periodo');

  let reservas = [];
  let periodo = 'proximas';
  let claveActual = '';

  function hoyStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function fechaLabel(fechaStr) {
    const [y, m, d] = fechaStr.split('-').map(Number);
    const fecha = new Date(y, m - 1, d);
    return DIAS[fecha.getDay()] + ' ' + d + ' de ' + MESES[m - 1];
  }

  async function cargar(clave) {
    loginError.style.display = 'none';
    btnEntrar.disabled = true;
    btnEntrar.textContent = 'Entrando…';
    try {
      const resp = await fetch(ENDPOINT + '?clave=' + encodeURIComponent(clave));
      const data = await resp.json();
      if (!data.ok) {
        loginError.textContent = 'Clave incorrecta.';
        loginError.style.display = 'block';
        btnEntrar.disabled = false;
        btnEntrar.textContent = 'Entrar';
        return;
      }
      claveActual = clave;
      reservas = data.reservas || [];
      if (inRecordar.checked) {
        try { localStorage.setItem(LS_KEY, clave); } catch (e) {}
      }
      mostrarDashboard();
    } catch (e) {
      loginError.textContent = 'No pudimos conectar. Probá de nuevo.';
      loginError.style.display = 'block';
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';
    }
  }

  async function refrescar() {
    btnRefresh.classList.add('loading');
    try {
      const resp = await fetch(ENDPOINT + '?clave=' + encodeURIComponent(claveActual));
      const data = await resp.json();
      if (data.ok) {
        reservas = data.reservas || [];
        render();
        updatedNote.textContent = 'Actualizado a las ' + new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
      }
    } catch (e) {}
    btnRefresh.classList.remove('loading');
  }

  function mostrarDashboard() {
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    btnLogout.style.display = 'inline-block';

    const medicos = Array.from(new Set(reservas.map(r => r.oftalmologo).filter(Boolean))).sort();
    filtroMedico.innerHTML = '<option value="">Todos los oftalmólogos</option>' +
      medicos.map(m => '<option value="' + m.replace(/"/g, '&quot;') + '">' + m + '</option>').join('');

    updatedNote.textContent = 'Actualizado a las ' + new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
    render();
  }

  function render() {
    const hoy = hoyStr();
    let filtradas = reservas.filter(r => r.fecha);

    if (periodo === 'hoy') filtradas = filtradas.filter(r => r.fecha === hoy);
    else if (periodo === 'proximas') filtradas = filtradas.filter(r => r.fecha > hoy);
    // 'todas' = sin filtro de fecha

    const medico = filtroMedico.value;
    if (medico) filtradas = filtradas.filter(r => r.oftalmologo === medico);

    const pago = filtroPago.value;
    if (pago === 'si') filtradas = filtradas.filter(r => r.pagado === 'Sí');
    else if (pago === 'no') filtradas = filtradas.filter(r => r.pagado !== 'Sí');

    const q = buscar.value.trim().toLowerCase();
    if (q) {
      filtradas = filtradas.filter(r =>
        (r.nombre || '').toLowerCase().includes(q) ||
        (r.cedula || '').toLowerCase().includes(q)
      );
    }

    filtradas.sort((a, b) => (a.fecha + ' ' + a.hora).localeCompare(b.fecha + ' ' + b.hora));

    document.getElementById('stat-hoy').textContent = reservas.filter(r => r.fecha === hoy).length;
    document.getElementById('stat-proximas').textContent = reservas.filter(r => r.fecha > hoy).length;
    document.getElementById('stat-total').textContent = reservas.length;

    lista.innerHTML = '';

    if (filtradas.length === 0) {
      lista.innerHTML =
        '<div class="empty-state">' +
        '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path><path d="M8 3v4M16 3v4"></path></svg>' +
        '<div>No hay reservas para mostrar con estos filtros.</div>' +
        '</div>';
      return;
    }

    const grupos = {};
    const orden = [];
    filtradas.forEach(r => {
      if (!grupos[r.fecha]) { grupos[r.fecha] = []; orden.push(r.fecha); }
      grupos[r.fecha].push(r);
    });

    orden.forEach(fecha => {
      const items = grupos[fecha];
      const esHoy = fecha === hoy;
      const grupoEl = document.createElement('div');
      grupoEl.className = 'day-group';

      const heading = document.createElement('div');
      heading.className = 'day-heading';
      heading.style.justifyContent = 'space-between';
      heading.style.flexWrap = 'wrap';
      heading.innerHTML =
        '<span>' + (esHoy ? 'Hoy · ' : '') + capitalizar(fechaLabel(fecha)) +
        ' <span class="count">(' + items.length + (items.length === 1 ? ' turno' : ' turnos') + ')</span></span>' +
        '<button type="button" class="btn-descargar-dia" style="background:none;border:1px solid #C7D6DC;color:#14496E;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;letter-spacing:.02em;display:flex;align-items:center;gap:6px">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"></path><path d="M6 11l6 6 6-6"></path><path d="M4 20h16"></path></svg>' +
          'Descargar planilla' +
        '</button>';
      grupoEl.appendChild(heading);
      heading.querySelector('.btn-descargar-dia').addEventListener('click', () => descargarPlanillaDia(fecha, items));

      items.forEach(r => {
        const card = document.createElement('div');
        card.className = 'appt-card';
        const diabetesBadge = r.diabetes === 'Sí' ? '<span class="badge badge-diabetes">Diabetes</span>' : '';
        const lentesBadge = r.lentesContacto === 'Sí' ? '<span class="badge badge-diabetes">Usa lentes de contacto</span>' : '';
        const pagadoBadge = r.pagado === 'Sí' ? '<span class="badge badge-pagado">Pagado' + (r.metodoPago ? ' · ' + escapeHtml(r.metodoPago) : '') + '</span>' : '';
        const sinCostoBadge = r.sinCosto === 'Sí' ? '<span class="badge badge-sincosto">Sin costo</span>' : '';
        const textoPagado = r.pagado === 'Sí' ? ('✓ Pagado' + (r.metodoPago ? ' (' + r.metodoPago + ')' : '') + ' — desmarcar') : 'Marcar como pagado';
        card.innerHTML =
          '<div class="appt-time">' + (r.hora || '') + '</div>' +
          '<div class="appt-body">' +
            '<div class="appt-top"><span class="appt-name">' + escapeHtml(r.nombre || 'Sin nombre') + '</span>' + diabetesBadge + lentesBadge + pagadoBadge + sinCostoBadge + '</div>' +
            '<div class="appt-meta"><b>' + escapeHtml(r.oftalmologo || '') + '</b> · ' + escapeHtml(r.servicio || '') + '</div>' +
            '<div class="appt-extra">Cédula ' + escapeHtml(r.cedula || '—') + ' · Nac. ' + escapeHtml(r.nacimiento || '—') + (r.telefono ? ' · <a href="https://wa.me/' + escapeHtml(r.telefono.replace(/\D/g, '')) + '" target="_blank" rel="noopener" style="color:#14496E;font-weight:600">' + escapeHtml(r.telefono) + '</a>' : '') + '</div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
              '<button type="button" class="btn-pagado" style="background:none;border:1px solid ' + (r.pagado === 'Sí' ? '#B7DCC3' : '#C7D6DC') + ';color:' + (r.pagado === 'Sí' ? '#1F7A45' : '#42545E') + ';font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer">' + textoPagado + '</button>' +
              '<button type="button" class="btn-sincosto" style="background:none;border:1px solid ' + (r.sinCosto === 'Sí' ? '#D4C4EC' : '#C7D6DC') + ';color:' + (r.sinCosto === 'Sí' ? '#5B3A9E' : '#42545E') + ';font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer">' + (r.sinCosto === 'Sí' ? '✓ Sin costo — desmarcar' : 'Marcar sin costo') + '</button>' +
              '<button type="button" class="btn-cancelar" style="background:none;border:1px solid #E7B4A5;color:#B4361A;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer">Cancelar reserva</button>' +
            '</div>' +
            '<div class="metodo-pago-row" style="display:none;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">' +
              '<span style="font-size:12px;color:#64757F">¿Cómo pagó?</span>' +
              '<button type="button" class="btn-metodo" data-metodo="Efectivo" style="background:none;border:1px solid #C7D6DC;color:#42545E;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer">Efectivo</button>' +
              '<button type="button" class="btn-metodo" data-metodo="Tarjeta" style="background:none;border:1px solid #C7D6DC;color:#42545E;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer">Tarjeta</button>' +
              '<button type="button" class="btn-metodo" data-metodo="Transferencia" style="background:none;border:1px solid #C7D6DC;color:#42545E;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer">Transferencia</button>' +
              '<button type="button" class="btn-metodo-cancelar" style="background:none;border:none;color:#93A5AF;font-size:13px;padding:6px 8px;cursor:pointer" title="Cancelar">✕</button>' +
            '</div>' +
            '<div style="display:flex;gap:8px;margin-top:8px;align-items:center">' +
              '<input type="text" class="obs-input" placeholder="Observaciones (opcional)" value="' + escapeHtml(r.observaciones || '') + '" style="flex:1;min-width:150px;border:1px solid #DCE2E5;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#0F2230">' +
              '<button type="button" class="btn-obs-guardar" style="background:none;border:1px solid #C7D6DC;color:#42545E;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap">Guardar</button>' +
            '</div>' +
          '</div>';
        const btnCancelar = card.querySelector('.btn-cancelar');
        btnCancelar.addEventListener('click', () => cancelarReserva(r, btnCancelar));
        const btnPagado = card.querySelector('.btn-pagado');
        const metodoPagoRow = card.querySelector('.metodo-pago-row');
        btnPagado.addEventListener('click', () => {
          if (r.pagado === 'Sí') {
            togglePagado(r, btnPagado, null);
          } else {
            metodoPagoRow.style.display = 'flex';
          }
        });
        card.querySelectorAll('.btn-metodo').forEach(b => {
          b.addEventListener('click', () => togglePagado(r, btnPagado, b.dataset.metodo));
        });
        card.querySelector('.btn-metodo-cancelar').addEventListener('click', () => { metodoPagoRow.style.display = 'none'; });
        const btnSinCosto = card.querySelector('.btn-sincosto');
        btnSinCosto.addEventListener('click', () => toggleSinCosto(r, btnSinCosto));
        const obsInput = card.querySelector('.obs-input');
        const btnObsGuardar = card.querySelector('.btn-obs-guardar');
        btnObsGuardar.addEventListener('click', () => guardarObservacion(r, obsInput, btnObsGuardar));
        grupoEl.appendChild(card);
      });

      lista.appendChild(grupoEl);
    });
  }

  const modalCancelar = document.getElementById('modal-cancelar');
  const modalDetalle = document.getElementById('modal-detalle');
  const modalInput = document.getElementById('modal-input');
  const modalConfirmar = document.getElementById('modal-confirmar');
  const modalCerrar = document.getElementById('modal-cerrar');
  let pendiente = null; // { reserva, boton }

  function abrirModalCancelar(r, boton) {
    pendiente = { r, boton };
    modalDetalle.innerHTML = '¿Cancelar la reserva de <b>' + escapeHtml(r.nombre || 'este paciente') + '</b> el ' +
      escapeHtml(r.fecha || '') + ' a las ' + escapeHtml(r.hora || '') + '? Esto libera la hora y no se puede deshacer.';
    modalInput.value = '';
    pintarBotonModal();
    modalCancelar.style.display = 'flex';
    modalInput.focus();
  }

  function cerrarModalCancelar() {
    modalCancelar.style.display = 'none';
    pendiente = null;
  }

  function pintarBotonModal() {
    const habilitado = modalInput.value.trim() === 'CANCELAR';
    modalConfirmar.disabled = !habilitado;
    modalConfirmar.style.background = habilitado ? '#B4361A' : '#DCE2E5';
    modalConfirmar.style.cursor = habilitado ? 'pointer' : 'not-allowed';
  }
  modalInput.addEventListener('input', pintarBotonModal);
  modalCerrar.addEventListener('click', cerrarModalCancelar);
  modalCancelar.addEventListener('click', (e) => { if (e.target === modalCancelar) cerrarModalCancelar(); });

  modalConfirmar.addEventListener('click', async () => {
    if (modalInput.value.trim() !== 'CANCELAR' || !pendiente) return;
    const { r, boton } = pendiente;
    modalConfirmar.disabled = true;
    modalConfirmar.textContent = 'Cancelando…';
    try {
      const url = ENDPOINT + '?clave=' + encodeURIComponent(claveActual) +
        '&cancelar=1&fecha=' + encodeURIComponent(r.fecha) +
        '&oftalmologo=' + encodeURIComponent(r.oftalmologo) +
        '&hora=' + encodeURIComponent(r.hora);
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.ok) {
        reservas = reservas.filter(x => !(x.fecha === r.fecha && x.oftalmologo === r.oftalmologo && x.hora === r.hora));
        cerrarModalCancelar();
        render();
        updatedNote.textContent = 'Reserva cancelada · ' + new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
      } else {
        alert('No pudimos cancelarla. Probá de nuevo.');
      }
    } catch (e) {
      alert('No pudimos conectar. Probá de nuevo.');
    } finally {
      modalConfirmar.textContent = 'Cancelar reserva';
      pintarBotonModal();
    }
  });

  function cancelarReserva(r, boton) {
    abrirModalCancelar(r, boton);
  }

  function textoBotonPagado(r) {
    return r.pagado === 'Sí' ? ('✓ Pagado' + (r.metodoPago ? ' (' + r.metodoPago + ')' : '') + ' — desmarcar') : 'Marcar como pagado';
  }

  async function togglePagado(r, boton, metodo) {
    const nuevoValor = metodo ? 'si' : (r.pagado === 'Sí' ? 'no' : 'si');
    boton.disabled = true;
    boton.textContent = 'Guardando…';
    try {
      const url = ENDPOINT + '?clave=' + encodeURIComponent(claveActual) +
        '&marcarPagado=1&pagado=' + nuevoValor +
        (metodo ? '&metodo=' + encodeURIComponent(metodo) : '') +
        '&fecha=' + encodeURIComponent(r.fecha) +
        '&oftalmologo=' + encodeURIComponent(r.oftalmologo) +
        '&hora=' + encodeURIComponent(r.hora) + '&_=' + Date.now();
      const resp = await fetch(url, { cache: 'no-store' });
      const data = await resp.json();
      if (data.ok) {
        r.pagado = nuevoValor === 'si' ? 'Sí' : 'No';
        r.metodoPago = nuevoValor === 'si' ? (metodo || r.metodoPago || '') : '';
        render();
        updatedNote.textContent = 'Actualizado · ' + new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
      } else {
        boton.disabled = false;
        boton.textContent = textoBotonPagado(r);
        alert('No pudimos guardarlo. Probá de nuevo.');
      }
    } catch (e) {
      boton.disabled = false;
      boton.textContent = textoBotonPagado(r);
      alert('No pudimos conectar. Probá de nuevo.');
    }
  }

  async function guardarObservacion(r, inputEl, boton) {
    const valor = inputEl.value.trim();
    boton.disabled = true;
    boton.textContent = 'Guardando…';
    try {
      const url = ENDPOINT + '?clave=' + encodeURIComponent(claveActual) +
        '&guardarObservacion=1&observacion=' + encodeURIComponent(valor) +
        '&fecha=' + encodeURIComponent(r.fecha) +
        '&oftalmologo=' + encodeURIComponent(r.oftalmologo) +
        '&hora=' + encodeURIComponent(r.hora) + '&_=' + Date.now();
      const resp = await fetch(url, { cache: 'no-store' });
      const data = await resp.json();
      if (data.ok) {
        r.observaciones = valor;
        boton.disabled = false;
        boton.textContent = 'Guardado ✓';
        setTimeout(() => { if (boton) boton.textContent = 'Guardar'; }, 1400);
      } else {
        boton.disabled = false;
        boton.textContent = 'Guardar';
        alert('No pudimos guardar la observación. Probá de nuevo.');
      }
    } catch (e) {
      boton.disabled = false;
      boton.textContent = 'Guardar';
      alert('No pudimos conectar. Probá de nuevo.');
    }
  }

  async function toggleSinCosto(r, boton) {
    const nuevoValor = r.sinCosto === 'Sí' ? 'no' : 'si';
    boton.disabled = true;
    boton.textContent = 'Guardando…';
    try {
      const url = ENDPOINT + '?clave=' + encodeURIComponent(claveActual) +
        '&marcarSinCosto=1&sinCosto=' + nuevoValor +
        '&fecha=' + encodeURIComponent(r.fecha) +
        '&oftalmologo=' + encodeURIComponent(r.oftalmologo) +
        '&hora=' + encodeURIComponent(r.hora) + '&_=' + Date.now();
      const resp = await fetch(url, { cache: 'no-store' });
      const data = await resp.json();
      if (data.ok) {
        r.sinCosto = nuevoValor === 'si' ? 'Sí' : 'No';
        render();
        updatedNote.textContent = 'Actualizado · ' + new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
      } else {
        boton.disabled = false;
        boton.textContent = r.sinCosto === 'Sí' ? '✓ Sin costo — desmarcar' : 'Marcar sin costo';
        alert('No pudimos guardarlo. Probá de nuevo.');
      }
    } catch (e) {
      boton.disabled = false;
      boton.textContent = r.sinCosto === 'Sí' ? '✓ Sin costo — desmarcar' : 'Marcar sin costo';
      alert('No pudimos conectar. Probá de nuevo.');
    }
  }

  function capitalizar(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Descarga, como planilla (.csv, se abre con Excel), los turnos de un solo
  // día — para llevarle al oftalmólogo justo los pacientes de esa consulta,
  // sin mezclarlos con los de otros días.
  function csvCelda(v) {
    const s = v == null ? '' : String(v);
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function descargarPlanillaDia(fecha, items) {
    const encabezados = ['Hora', 'Nombre', 'Cédula', 'Teléfono', 'Nacimiento', 'Oftalmólogo', 'Servicio', 'Diabetes', 'Lentes de contacto', 'Pagado', 'Método de pago', 'Sin costo', 'Observaciones'];
    const filas = items
      .slice()
      .sort((a, b) => (a.hora || '').localeCompare(b.hora || ''))
      .map(r => [r.hora, r.nombre, r.cedula, r.telefono, r.nacimiento, r.oftalmologo, r.servicio, r.diabetes, r.lentesContacto, r.pagado, r.metodoPago, r.sinCosto, r.observaciones]);
    const csv = [encabezados, ...filas].map(fila => fila.map(csvCelda).join(';')).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'turnos_' + fecha + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  tabsPeriodo.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-periodo]');
    if (!btn) return;
    periodo = btn.dataset.periodo;
    tabsPeriodo.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
  filtroMedico.addEventListener('change', render);
  filtroPago.addEventListener('change', render);
  buscar.addEventListener('input', render);
  btnRefresh.addEventListener('click', refrescar);
  btnEntrar.addEventListener('click', () => {
    const clave = inClave.value.trim();
    if (!clave) return;
    cargar(clave);
  });
  inClave.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnEntrar.click(); });
  btnLogout.addEventListener('click', () => {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    reservas = []; claveActual = '';
    dashboard.style.display = 'none';
    loginScreen.style.display = 'flex';
    btnLogout.style.display = 'none';
    inClave.value = '';
  });

  // Auto-login si hay clave guardada
  try {
    const guardada = localStorage.getItem(LS_KEY);
    if (guardada) { inClave.value = guardada; cargar(guardada); }
  } catch (e) {}
})();
</script>
